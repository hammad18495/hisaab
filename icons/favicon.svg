<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a8a62"/>
      <stop offset="1" stop-color="#00513a"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd25a"/>
      <stop offset="1" stop-color="#f0a500"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- subtle ledger lines -->
  <g stroke="#ffffff" stroke-opacity=".07" stroke-width="10" stroke-linecap="round">
    <line x1="96" y1="120" x2="416" y2="120"/>
    <line x1="96" y1="392" x2="416" y2="392"/>
  </g>
  <!-- H pillars -->
  <rect x="132" y="128" width="72" height="256" rx="30" fill="#ffffff"/>
  <rect x="308" y="128" width="72" height="256" rx="30" fill="#ffffff"/>
  <!-- crossbar -->
  <rect x="190" y="228" width="132" height="56" rx="20" fill="#ffffff"/>
  <!-- coin -->
  <circle cx="256" cy="256" r="66" fill="#00513a" opacity=".35"/>
  <circle cx="256" cy="252" r="60" fill="url(#coin)" stroke="#ffffff" stroke-width="12"/>
  <circle cx="256" cy="252" r="36" fill="none" stroke="#c98500" stroke-width="6" opacity=".55"/>
  <path d="M236 252 l14 14 l26 -30" fill="none" stroke="#7a4f00" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
